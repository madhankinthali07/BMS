services:
  - type: web
    name: showzy
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: APP_NAME
        value: Showzy
      - key: DEBUG
        value: false
